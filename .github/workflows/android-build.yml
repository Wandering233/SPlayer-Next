name: Android Build

on:
  push:
    branches: [ main, develop, 'android/**' ]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'native/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'capacitor.config.ts'
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11.0
          platform-tools-version: 35.0.1
          build-tools-version: 35.0.0
          api-level: 35
          extra-packages: |
            extras;google;m2repository
            google;gms;google-services
            google;auto

      - name: Enable KVM (for emulator if needed)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Frontend
        run: |
          pnpm build
          echo "Frontend build completed"
          ls -la out/renderer/

      - name: Sync Capacitor
        run: |
          pnpm cap sync android
          echo "Capacitor sync completed"

      - name: Decode Keystore (for release builds only)
        if: github.event.inputs.build_type == 'release' || github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding keystore for release build..."
            echo $KEYSTORE_BASE64 | base64 --decode > android/app/splayer-keystore.jks
            echo "Keystore decoded successfully"
          else
            echo "No keystore found, skipping release signing"
          fi

      - name: Grant execute permission to Gradle wrapper
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK
        if: github.event.inputs.build_type != 'release' && !(github.event_name == 'push' && contains(github.ref, 'refs/tags/'))
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "Debug build completed"
          
      - name: Build Release APK
        if: github.event.inputs.build_type == 'release' || (github.event_name == 'push' && contains(github.ref, 'refs/tags/'))
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -f "app/splayer-keystore.jks" ]; then
            echo "Building signed release APK..."
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "Keystore not found, building unsigned release APK..."
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Build AAB (Android App Bundle)
        if: github.event.inputs.build_type == 'release' || (github.event_name == 'push' && contains(github.ref, 'refs/tags/'))
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -f "app/splayer-keystore.jks" ]; then
            ./gradlew bundleRelease --no-daemon --stacktrace
          else
            echo "Keystore not found, skipping AAB build"
          fi

      - name: List build outputs
        run: |
          echo "=== Debug APK ==="
          ls -lh android/app/build/outputs/apk/debug/*.apk 2>/dev/null || echo "No debug APK found"
          
          echo "=== Release APK ==="
          ls -lh android/app/build/outputs/apk/release/*.apk 2>/dev/null || echo "No release APK found"
          
          echo "=== Release AAB ==="
          ls -lh android/app/build/outputs/bundle/release/*.aab 2>/dev/null || echo "No release AAB found"

      - name: Upload Debug APK Artifact
        if: github.event.inputs.build_type != 'release' && !(github.event_name == 'push' && contains(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: splayer-next-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Release APK Artifact
        if: github.event.inputs.build_type == 'release' || (github.event_name == 'push' && contains(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: splayer-next-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Release AAB Artifact
        if: github.event.inputs.build_type == 'release' || (github.event_name == 'push' && contains(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: splayer-next-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: ignore

      - name: Create Release (for tagged commits)
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          rm -rf android/app/splayer-keystore.jks 2>/dev/null || true
          echo "Cleanup completed"
