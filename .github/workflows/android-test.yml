name: Android Test & Lint

on:
  push:
    branches: [ main, develop, 'android/**' ]
    paths:
      - 'android/**'
      - 'src/android/**'
      - '.github/workflows/android-test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'android/**'
      - 'src/android/**'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  test-android:
    name: Test & Lint Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11.0
          platform-tools-version: 35.0.1
          build-tools-version: 35.0.0
          api-level: 35

      - name: Build Frontend
        run: pnpm build

      - name: Sync Capacitor
        run: pnpm cap sync android

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x android/gradlew

      - name: Run Lint
        run: |
          cd android
          ./gradlew lint --no-daemon --stacktrace
          
      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Run Tests (Unit Tests)
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon --stacktrace
          
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore

      - name: Check Code Style
        run: |
          cd android
          ./gradlew checkstyle --no-daemon --stacktrace || echo "Checkstyle not configured"

      - name: Verify Debug Build
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "Debug build verified successfully"

      - name: Analyze APK Size
        if: success()
        run: |
          echo "=== APK Size Analysis ==="
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          
          # Extract and analyze
          cd android/app/build/outputs/apk/debug/
          unzip -l app-debug.apk | head -50
          
          echo ""
          echo "=== Largest files in APK ==="
          unzip -l app-debug.apk | awk '{print $1}' | sort -rn | head -20

  ui-e2e-test:
    name: UI E2E Test (Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test-android
    if: github.event_name == 'push' && contains(github.ref, 'refs/heads/main')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11.0
          platform-tools-version: 35.0.1
          build-tools-version: 35.0.0
          api-level: 35

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Frontend
        run: pnpm build

      - name: Sync Capacitor
        run: pnpm cap sync android

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x android/gradlew

      - name: Create AVD and Run Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            echo "Waiting for emulator to be ready..."
            adb wait-for-device
            
            echo "Device info:"
            adb shell getprop ro.build.characteristics
            adb shell wm size
            adb shell wm density
            
            echo "Installing APK..."
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            
            echo "Starting app..."
            adb shell am start -n com.splayer.next/.MainActivity
            
            echo "Running basic smoke tests..."
            # Wait for app to load
            sleep 10
            
            # Take screenshot
            adb shell screencap -p /sdcard/screenshot.png
            adb pull /sdcard/screenshot.png ./screenshot.png
            
            # Basic interaction test
            adb shell input tap 500 1000
            sleep 2
            adb shell input keyevent 4  # Back button
            
            echo "E2E smoke test completed"

      - name: Upload Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: screenshot.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Logcat
        if: always()
        run: |
          adb logcat -d > logcat.txt 2>/dev/null || echo "No logcat available"
          
      - name: Upload Logcat Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-output
          path: logcat.txt
          retention-days: 7
          if-no-files-found: ignore
